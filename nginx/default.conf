# Finanzkompass – Webserver im Container: liefert die App aus und leitet /api/ an den optionalen Proxy weiter

# Dateinamen tragen keine Versionsnummer: App-Dateien immer neu prüfen, damit Updates sofort ankommen
map $uri $fk_cache_control {
    ~^/assets/  "public, max-age=604800";
    ~^/api/     "no-store";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Sicherheit: nur eigene Skripte, keine Einbettung in fremde Seiten, keine Referrer an Banken
    add_header Cache-Control $fk_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Web-App-Manifest (fehlt in der MIME-Tabelle von nginx)
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Live-Verbindung: Proxy-Container (nur mit „docker compose --profile live“). Läuft er nicht, antwortet nginx mit 502.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $proxy_upstream http://proxy:8787;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $proxy_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
